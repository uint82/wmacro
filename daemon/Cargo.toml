[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
core_types = { path = "../core_types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inotify = "0.11.4"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
libc = "0.2"

